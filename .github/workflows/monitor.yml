name: bb-monitor

on:
  schedule:
    # Every 30 min (UTC). GitHub often delays scheduled runs by 5-15 min,
    # especially on the free tier — this is near-real-time, not to-the-second.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ping:
        description: 'Send a Telegram connectivity test and exit (no baseline/diff)'
        type: boolean
        default: false

# Needed so the job can commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: bb-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # --- tuning (edit freely) ---
          ONLY_PAYING: 'false'   # 'true' = ignore VDP / no-bounty events
          MAX_MSGS: '40'         # cap messages per run; overflow is summarized
          KEYWORDS: ''           # e.g. 'bank,pay,crypto,api' -> only matching program names
          # --- internal: set by the "ping" button only ---
          PING: ${{ (github.event_name == 'workflow_dispatch' && inputs.ping) && '1' || '' }}
        run: python monitor.py

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "bb-monitor[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "update state [skip ci]"
            git push
          else
            echo "no state change"
          fi
